

<div class="row" style="margin-left:95px; margin-top:30px;">
  <div class="row">
      <div class="col s8">
        <div class="card flex justify-center">
            <p-autocomplete
              [(ngModel)]="value"
              (completeMethod)="search($event)"
              style="width: 400px; height: 47px;"
              [suggestions]="items"
              optionLabel="contato"
              [dropdown]="true"/>

            <p-button
              label="Selecionar"
              [style]="{'margin-left': '20px'}"
              (onClick)="onClickBtSelecionar()"
              severity="contrast" />

            <p-button
              label="Novo Contato"
              [style]="{'margin-left': '20px'}"
              (onClick)="onClickBtNovo()"
              severity="contrast" />
        </div>
		  </div>

  </div>
</div>
